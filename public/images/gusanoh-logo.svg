<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      /* Líneas blancas para fondo oscuro */
      .bold-stroke   { stroke: #ffffff; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .medium-stroke { stroke: #ffffff; stroke-width: 8;  stroke-linecap: round; stroke-linejoin: round; }
      .thin-stroke   { stroke: #ffffff; stroke-width: 4;  stroke-linecap: round; stroke-linejoin: round; }

      /* Líneas negras: solo para lo que va dibujado sobre el gusano rosa */
      .ink-medium { stroke: #000000; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thin   { stroke: #000000; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

      .guitar-wood { fill: #111111; stroke: #ffffff; stroke-width: 12; stroke-linejoin: round; }
      .worm-body   { fill: #ff2a5f; stroke: #ffffff; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }

      .band-title {
        font-family: 'Impact', 'Arial Black', sans-serif;
        font-size: 82px;
        font-weight: 900;
        letter-spacing: 12px;
        fill: #ffffff;
        text-anchor: middle;
      }
      .band-sub {
        font-family: 'Arial Black', sans-serif;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 10px;
        fill: #ff2a5f;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Sin rectángulo de fondo: el logo es transparente -->

  <g transform="translate(0, -30)">
    <g id="emblem">

      <!-- CUERPO Y MÁSTIL DE LA GUITARRA -->
      <path class="guitar-wood" d="
        M 380 200
        L 420 200
        L 420 310
        C 445 300, 475 305, 475 345
        C 475 375, 445 385, 435 395
        C 470 415, 495 450, 495 500
        C 495 570, 420 590, 400 590
        C 380 590, 305 570, 305 500
        C 305 450, 330 415, 365 395
        C 355 385, 325 375, 325 345
        C 325 305, 355 300, 380 310
        Z" />

      <!-- Boca y roseta -->
      <circle cx="400" cy="370" r="42" fill="#000000" />
      <circle cx="400" cy="370" r="50" fill="none" class="medium-stroke" />
      <circle cx="400" cy="370" r="58" fill="none" class="thin-stroke" stroke-dasharray="8 6" />

      <!-- Puente -->
      <rect x="350" y="510" width="100" height="24" rx="4" fill="#ffffff" />
      <rect x="370" y="516" width="60" height="12" fill="#111111" />

      <!-- Cabeza del mástil -->
      <path class="guitar-wood" d="
        M 370 200
        L 370 80
        C 370 65, 385 55, 400 68
        C 415 55, 430 65, 430 80
        L 430 200
        Z" />
      <rect x="380" y="90" width="12" height="70" rx="6" fill="#ffffff" />
      <rect x="408" y="90" width="12" height="70" rx="6" fill="#ffffff" />

      <!-- Clavijas -->
      <circle cx="358" cy="105" r="8" fill="#ffffff" />
      <circle cx="358" cy="125" r="8" fill="#ffffff" />
      <circle cx="358" cy="145" r="8" fill="#ffffff" />
      <circle cx="442" cy="105" r="8" fill="#ffffff" />
      <circle cx="442" cy="125" r="8" fill="#ffffff" />
      <circle cx="442" cy="145" r="8" fill="#ffffff" />

      <!-- Trastes -->
      <line x1="385" y1="200" x2="415" y2="200" class="medium-stroke" />
      <line x1="385" y1="230" x2="415" y2="230" class="thin-stroke" />
      <line x1="385" y1="260" x2="415" y2="260" class="thin-stroke" />
      <line x1="385" y1="290" x2="415" y2="290" class="thin-stroke" />

      <!-- GUSANO -->
      <path class="worm-body" d="M 330 460 C 270 420, 290 330, 360 320" />

      <path class="worm-body" d="
        M 350 320
        C 440 310, 510 360, 480 430
        C 450 500, 330 450, 280 500
        C 220 560, 310 640, 410 630
        C 510 620, 540 530, 480 480" />

      <!-- Rayas del gusano (negras, sobre el rosa) -->
      <path class="ink-thin" d="M 440 325 L 435 363" />
      <path class="ink-thin" d="M 466 346 L 448 380" />
      <path class="ink-thin" d="M 478 380 L 448 402" />

      <path class="ink-thin" d="M 340 468 L 322 500" />
      <path class="ink-thin" d="M 305 482 L 298 520" />
      <path class="ink-thin" d="M 282 510 L 290 546" />

      <path class="ink-thin" d="M 350 626 L 360 590" />
      <path class="ink-thin" d="M 388 630 L 388 592" />
      <path class="ink-thin" d="M 425 625 L 415 588" />

      <!-- Cabeza del gusano -->
      <g id="worm-head">
        <path class="worm-body" d="
          M 290 350
          C 250 320, 240 250, 300 220
          C 360 190, 390 250, 350 300
          Z" />

        <!-- Ojo -->
        <polygon points="305,245 330,255 310,265" fill="#000000" />
        <circle cx="312" cy="254" r="3" fill="#ffffff" />

        <!-- Sonrisa -->
        <path d="M 285 275 Q 310 295 335 270" fill="none" class="ink-medium" />

        <!-- Colmillos -->
        <polygon points="298,282 306,297 312,285" fill="#000000" />
        <polygon points="315,284 322,295 327,278" fill="#000000" />
      </g>

      <!-- Cola del gusano -->
      <path class="worm-body" d="M 480 480 C 510 450, 530 490, 500 520 C 470 550, 440 520, 440 520" />

      <!-- Cuerdas -->
      <g class="thin-stroke" opacity="0.8">
        <line x1="390" y1="80" x2="390" y2="516" />
        <line x1="394" y1="80" x2="394" y2="516" />
        <line x1="398" y1="80" x2="398" y2="516" />
        <line x1="402" y1="80" x2="402" y2="516" />
        <line x1="406" y1="80" x2="406" y2="516" />
        <line x1="410" y1="80" x2="410" y2="516" />
      </g>

      <!-- Estrellas y rayo -->
      <polygon points="230,200 238,220 260,220 242,232 248,252 230,240 212,252 218,232 200,220 222,220" fill="#ffffff" />
      <polygon points="560,360 565,375 580,375 568,384 572,398 560,388 548,398 552,384 540,375 555,375" fill="#ff2a5f" />
      <path d="M 520 220 L 490 260 L 510 260 L 480 310" fill="none" class="bold-stroke" stroke-linecap="square" />
    </g>

    <!-- TEXTO -->
    <g id="typography">
      <text x="400" y="715" class="band-title">GUSANOH</text>

      <rect x="230" y="732" width="340" height="8" fill="#ffffff" />
      <rect x="370" y="730" width="60" height="12" fill="#ff2a5f" />

      <text x="400" y="768" class="band-sub">ALTERNATIVE ROCK</text>
    </g>
  </g>
</svg>